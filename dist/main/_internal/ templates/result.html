{% extends 'base.html' %}

{% block title %}
    <title>{{ context.title }}</title>
{% endblock %}


{% block header %}
    <div class="header">
        <div class="head_inside">
            <h2 class="header_text">{{ context.title }}</h2>
        </div>
    </div>
{% endblock %}


{% block content %}

    <div class="head_inside">
        <h3 class="header_text">{{ context.result }}</h3>
    </div>
    {% if not context.flag %}    
        {% if context.misstakes > 0 %}
            <div class="head_inside">
                <a class="start_button clean_a" href="{{ url_for('show_misstakes') }}">
                    <button class="start_button_1 global_text">Посмотреть ошибки</button></a>
                <br>
            </div>
        {% endif %}  
    {% endif %}  
    <form action="{{ url_for('index') }}" method="post">
        <div class="head_inside">
            <a class="start_button clean_a" href="{{ url_for('index') }}">
                <button name="name" value="{{ [context.admin, context.user] }}" class="start_button_1 global_text">На главную</button></a>
        </div>
        <br>
    </form>
    
{% endblock %}
